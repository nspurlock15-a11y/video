name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LocalStream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LocalStream-apk
          path: LocalStream.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LocalStream.apk \
            --target "${{ github.sha }}" \
            --title "LocalStream build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download LocalStream.apk on your phone and open it to install or update." \
            --latest
